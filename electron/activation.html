<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Activate Renovo Pro</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1B3A6B;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card {
    width: 360px;
    background: white;
    border-radius: 12px;
    padding: 28px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { font-size: 13px; color: #666; margin: 0 0 20px; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 10px 12px;
    border: none;
    border-radius: 8px;
    background: #1B3A6B;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .error { color: #c0392b; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Activate Renovo Pro</h1>
    <p>Enter the activation code your platform administrator gave you.</p>
    <form id="activateForm">
      <input id="code" type="text" placeholder="rpt_..." autofocus />
      <button id="activateBtn" type="submit">Activate</button>
    </form>
    <div id="error" class="error"></div>
  </div>

  <script>
    const form = document.getElementById('activateForm')
    const btn = document.getElementById('activateBtn')
    const input = document.getElementById('code')
    const errorEl = document.getElementById('error')

    // A network-level failure (no internet yet on a freshly unboxed till)
    // throws a raw "Failed to fetch"/"fetch failed" from the platform —
    // technically accurate, meaningless to whoever is setting up the
    // machine. Caught here and given a message that actually tells them
    // what to check.
    function friendlyMessage(err) {
      const raw = err && err.message ? err.message : ''
      if (/fetch|network|ENOTFOUND|ECONNREFUSED|ETIMEDOUT/i.test(raw)) {
        return 'No internet connection — activation needs to reach the Renovo Pro Portal. Check this PC\'s network connection and try again.'
      }
      return raw || 'Activation failed'
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      errorEl.textContent = ''
      btn.disabled = true
      btn.textContent = 'Activating…'
      try {
        await window.electronAPI.activateDevice(input.value.trim())
      } catch (err) {
        errorEl.textContent = friendlyMessage(err)
        btn.disabled = false
        btn.textContent = 'Activate'
      }
    })
  </script>
</body>
</html>
