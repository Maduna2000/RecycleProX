<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Starting Renovo Pro</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1B3A6B;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    color: #EAF0FA;
  }
  .spinner {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.22);
    border-top-color: #ffffff;
    animation: spin 0.9s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  p {
    margin: 0;
    font-size: 12px;
    color: rgba(234, 240, 250, 0.65);
    text-align: center;
    max-width: 260px;
  }
</style>
</head>
<body>
  <div class="spinner" role="status" aria-label="Starting"></div>
  <h1>Starting Renovo Pro…</h1>
  <p>This can take a little longer the first time it runs.</p>
</body>
</html>
