name: Build Guard Station APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - guard-station/**
      - .github/workflows/build-guard-station-apk.yml

jobs:
  build:
    name: Build Guard Station APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: guard-station/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: guard-station
        run: npm ci

      - name: Make Gradle wrapper executable
        working-directory: guard-station/android
        run: chmod +x gradlew

      # Debug build, signed with the checked-in debug.keystore (standard
      # Android debug defaults — never a security boundary) rather than
      # Gradle's own auto-generated one. GitHub Actions runners are
      # ephemeral, so without a fixed keystore every build gets a brand-new
      # random signing key, and Android refuses to install an update over an
      # app signed with a different certificate — this is exactly the bug
      # that made the equivalent guard-cap CI builds appear to do nothing
      # (see commit 855e1e0). Pinning it here from the start avoids repeating
      # that.
      - name: Build debug APK
        working-directory: guard-station/android
        run: ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuardStation-${{ github.sha }}.apk
          path: guard-station/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
