name: Build Desktop Installer

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build from
        required: false
        default: master

jobs:
  build:
    name: Build Renovo Pro Desktop (Windows)
    runs-on: windows-latest
    # Job-level so it's both an OS env var for every step (the build step
    # needs it baked into resources/app-update.yml) AND readable from a
    # step's `if:` condition below — the `secrets` context is NOT allowed
    # directly inside `if:` (GitHub Actions rejects the workflow at parse
    # time with "Unrecognized named-value: 'secrets'"), only inside `env:`
    # or a `run:` step's own env mapping. Proxying it through `env:` here
    # once, then referencing `env.DESKTOP_UPDATE_FEED_BASE_URL` in the `if:`
    # below, is the actual supported pattern.
    env:
      DESKTOP_UPDATE_FEED_BASE_URL: ${{ secrets.DESKTOP_UPDATE_FEED_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # workflow_dispatch supplies its own branch input; a plain push
          # trigger has no such input (github.event.inputs.branch is empty
          # there), so fall back to whatever ref actually triggered this run.
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Visual Studio Build Tools (C++ workload)
        run: choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --quiet --wait --norestart" -y
        shell: pwsh

      - name: Build desktop installer
        run: npm run electron:build
        env:
          # Needed for real here (not a placeholder) — build:desktop now runs
          # `prisma migrate deploy` before `next build` (see scripts/
          # build-desktop-postgres.ts), so this must be a live, reachable
          # connection string with DDL privileges, same role Vercel's own
          # migration step uses (never the restricted app_runtime role — see
          # src/lib/db/prisma.ts's comment on why those are different roles).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # AUTH_SECRET, INTERNAL_API_SHARED_SECRET, RENOVO_PORTAL_BASE_URL,
          # and TENANT_BASE_DOMAIN are deliberately NOT set here. electron/
          # main.js is copied into the installer verbatim (package.json's
          # build.files — it is never bundled/processed by webpack or Next),
          # so its own process.env reads only ever see whatever's set on the
          # END USER's machine at runtime, never a value from this CI build
          # step. Setting them here silently does nothing to the shipped
          # app — every install's Portal URL, for example, is controlled
          # entirely by electron/main.js's own hardcoded PORTAL_BASE_URL
          # fallback (or a real RENOVO_PORTAL_BASE_URL in that machine's own
          # desktop.env) — not by this workflow. Confirmed while auditing the
          # desktop pipeline; removed rather than left as misleading dead
          # configuration that looks like it configures the installer.
          #
          # electron-builder signs automatically once these are present —
          # see electron/README.md's "Code signing" section. Unset repo
          # secrets resolve to empty strings, so this is a no-op (installer
          # stays unsigned) until a real certificate is purchased and these
          # two secrets are added — no further workflow changes needed then.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # DESKTOP_UPDATE_FEED_BASE_URL itself comes from the job-level env
          # above (already an OS env var for every step, including this
          # one) — baked into resources/app-update.yml so the installed app
          # knows where to check for updates (package.json's build.publish).
          # See electron/README.md's "Auto-updates" section. Empty until
          # that secret is added, same no-op-until-configured pattern as
          # signing.

      - name: Smoke-test native modules under the packaged Electron runtime
        # sharp/serialport/node-thermal-printer are copied into
        # .next/standalone/node_modules by scripts/build-desktop-postgres.ts
        # as prebuilt binaries from THIS RUNNER's plain Node 24 (see that
        # script's own comment on why the copy exists) — but main.js loads
        # them by spawning the packaged Electron.exe itself with
        # ELECTRON_RUN_AS_NODE=1, not plain node. electron-builder's
        # automatic native-module rebuild only walks the real dependency
        # tree resolved through node_modules at the project root (which is
        # why build.files above doesn't even list node_modules/**) — it has
        # no visibility into this manually-copied standalone tree, so
        # whether these binaries actually work under Electron's own ABI
        # depends entirely on them being N-API-based (cross-runtime-safe by
        # design) rather than something never verified. Load them here
        # exactly the way main.js does — same exe, same flag, same relative
        # position next to node_modules — so a real ABI mismatch fails this
        # build loudly instead of shipping an installer where printing or
        # report-photo generation silently breaks on a customer's PC.
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "Renovo Pro.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Could not find the packaged Renovo Pro.exe under dist/ (unpacked electron-builder output) — packaging must have failed silently." }
          $appDir = Join-Path $exe.Directory.FullName "resources\app\.next\standalone"
          if (-not (Test-Path $appDir)) { throw "Expected standalone app dir not found at $appDir" }

          # Four earlier attempts all failed for different plumbing reasons,
          # none of them a real native-module problem:
          #  1) Wrote a .js file to disk, passed its path as an argv script —
          #     failed with "Cannot find module <that exact path>" moments
          #     after Test-Path confirmed the file was there, in two
          #     different directories (once in the just-signed standalone
          #     tree, once in a fresh $RUNNER_TEMP dir).
          #  2) Passed the test as inline code via -e instead, capturing
          #     output with `$output = & $exe.FullName ... 2>&1`. One run
          #     printed the success marker and STILL threw (an unreliable
          #     $LASTEXITCODE). The very next run came back with `$output`
          #     completely empty — no marker, no error text at all.
          #  3) Switched to Start-Process with explicit
          #     -RedirectStandardOutput/-Error files, on the theory that
          #     Renovo Pro.exe (a GUI-subsystem binary) wasn't handing its
          #     console output back through PowerShell's pipeline capture.
          #     Result: exit code 0, but BOTH the redirected stdout and
          #     stderr files came back completely empty — no marker, no
          #     error, nothing at all. That rules out console-capture
          #     semantics as the culprit; something about how the -e code
          #     reaches (or doesn't reach) the process, or how a
          #     GUI-subsystem process's stdio behaves under any capture
          #     method, is the real problem — not the modules themselves.
          #  4) Kept the file-based result (no stdio reliance) but switched
          #     invocation to Start-Process -ArgumentList @('-e', $code).
          #     Root cause finally surfaced: Node's own eval error was
          #     "[eval]:1 / try / Expected '{', got '<eof>'" — Start-Process
          #     had mangled/truncated the $code argument (parens/semicolons/
          #     quotes don't survive its array-to-command-line requoting)
          #     down to just the bare word "try". Not a native-module issue
          #     at all — Electron never even received the real script.
          # The earlier attempt that DID get a full, correctly-quoted -e
          # string through (773e168, which printed the success marker) used
          # the `&` call operator, not Start-Process — PowerShell's own
          # array-to-native-argv handling for `&` copes with this string
          # fine. Combines that proven-working invocation with the
          # file-based result check (no stdio reliance) from attempt 3/4.
          $marker = "native modules loaded OK under the packaged Electron runtime"
          $resultFile = Join-Path $env:RUNNER_TEMP "native-smoketest-result.txt"
          Remove-Item $resultFile -ErrorAction SilentlyContinue

          $env:ELECTRON_RUN_AS_NODE = "1"
          $resultFileJs = $resultFile.Replace('\', '\\')
          $code = "try { require('sharp'); require('serialport'); require('node-thermal-printer'); require('fs').writeFileSync('$resultFileJs', '$marker'); } catch (e) { require('fs').writeFileSync('$resultFileJs', 'FAILED: ' + (e && e.stack ? e.stack : e)); }"

          Push-Location $appDir
          try {
            & $exe.FullName -e $code | Out-Null
          } finally {
            Pop-Location
          }

          $result = if (Test-Path $resultFile) { Get-Content $resultFile -Raw } else { $null }
          Write-Output "result file contents: $result"

          if (-not $result) {
            throw "Native module smoke test produced no result file at all — the packaged Electron.exe likely never ran the -e code. See output above."
          }
          if (-not ($result -match [regex]::Escape($marker))) {
            throw "Native module smoke test failed under the packaged Electron runtime (likely a native-module ABI mismatch — sharp/serialport/node-thermal-printer built for plain Node, not Electron). See output above."
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenovoPro-Desktop-Setup-${{ github.sha }}
          path: dist/*.exe
          retention-days: 14
          if-no-files-found: error

      - name: Publish release files to the update feed
        # Needs DESKTOP_UPDATE_FEED_BASE_URL and DESKTOP_RELEASE_UPLOAD_SECRET
        # as repo secrets — see electron/README.md's "Auto-updates" section.
        #
        # Uses DESKTOP_RELEASE_UPLOAD_SECRET, a CI-only secret that is never
        # sent to any till. It must NOT be INTERNAL_API_SHARED_SECRET: every
        # activated till holds that one in its desktop.env, so it would let a
        # customer PC publish an "update" to every other till.
        #
        # How it works: the installer and its .blockmap are far too big to send
        # through the Web app, so for each of them we ask the Web app for a
        # short-lived upload link (POST .../desktop-release/presign) and PUT the
        # file straight to R2. latest.yml — the small file every till trusts —
        # goes through the Web app (POST .../desktop-release), which validates
        # it, and goes up LAST so the feed never advertises a version whose
        # installer failed to upload. The first failure stops the step. HTTP
        # statuses and replies are printed (the old silent `curl -sf` made every
        # failure look like a bare "exit code 22").
        # (The secret is checked inside the script, not in this `if:` — a step's
        # own `env` isn't visible to its `if:`, and putting the secret in the
        # job-level env would expose it to every `npm ci` install script.)
        if: ${{ env.DESKTOP_UPDATE_FEED_BASE_URL != '' }}
        shell: bash
        env:
          DESKTOP_RELEASE_UPLOAD_SECRET: ${{ secrets.DESKTOP_RELEASE_UPLOAD_SECRET }}
        run: |
          if [ -z "$DESKTOP_RELEASE_UPLOAD_SECRET" ]; then
            echo "::warning::DESKTOP_UPDATE_FEED_BASE_URL is set but DESKTOP_RELEASE_UPLOAD_SECRET is not — skipping the update-feed upload. Add that repo secret (it must differ from INTERNAL_API_SHARED_SECRET)."
            exit 0
          fi
          shopt -s nullglob
          big=(dist/*.exe dist/*.blockmap)
          if [ ${#big[@]} -eq 0 ]; then echo "::error::No installer found in dist/"; exit 1; fi
          if [ ! -f dist/latest.yml ]; then echo "::error::dist/latest.yml not found"; exit 1; fi
          resp="$RUNNER_TEMP/release-response.txt"

          for f in "${big[@]}"; do
            name=$(basename "$f")
            size=$(wc -c < "$f" | tr -d ' ')
            echo "Requesting upload link for $name ($size bytes)"
            body=$(node -e 'process.stdout.write(JSON.stringify({filename:process.argv[1],size:Number(process.argv[2])}))' "$name" "$size")
            code=$(curl -sS -o "$resp" -w '%{http_code}' -X POST "$DESKTOP_UPDATE_FEED_BASE_URL/api/internal/desktop-release/presign" \
              -H "x-release-secret: $DESKTOP_RELEASE_UPLOAD_SECRET" -H "Content-Type: application/json" -d "$body")
            echo "HTTP $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then head -c 500 "$resp"; echo; echo "::error::Could not get an upload link for $name (HTTP $code)"; exit 1; fi
            url=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).url)' "$resp")
            echo "Uploading $name to R2"
            code=$(curl -sS -o "$resp" -w '%{http_code}' -X PUT -H "Content-Type: application/octet-stream" --upload-file "$f" "$url")
            echo "HTTP $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then head -c 500 "$resp"; echo; echo "::error::R2 rejected the upload of $name (HTTP $code)"; exit 1; fi
          done

          echo "Publishing latest.yml"
          code=$(curl -sS -o "$resp" -w '%{http_code}' -X POST "$DESKTOP_UPDATE_FEED_BASE_URL/api/internal/desktop-release" \
            -H "x-release-secret: $DESKTOP_RELEASE_UPLOAD_SECRET" -F "file=@dist/latest.yml")
          echo "HTTP $code"; head -c 500 "$resp"; echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "::error::Publishing latest.yml failed (HTTP $code)"; exit 1; fi
