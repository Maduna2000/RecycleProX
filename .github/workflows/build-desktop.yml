name: Build Desktop Installer

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build from
        required: false
        default: master

jobs:
  build:
    name: Build Renovo Pro Desktop (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Visual Studio Build Tools (C++ workload)
        run: choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --quiet --wait --norestart" -y
        shell: pwsh

      - name: Build desktop installer
        run: npm run electron:build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          INTERNAL_API_SHARED_SECRET: ${{ secrets.INTERNAL_API_SHARED_SECRET }}
          RENOVO_PORTAL_BASE_URL: ${{ secrets.RENOVO_PORTAL_BASE_URL }}
          TENANT_BASE_DOMAIN: ${{ secrets.TENANT_BASE_DOMAIN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenovoPro-Desktop-Setup-${{ github.sha }}
          path: dist/*.exe
          retention-days: 14
          if-no-files-found: error
