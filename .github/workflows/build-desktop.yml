name: Build Desktop Installer

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build from
        required: false
        default: master

jobs:
  build:
    name: Build Renovo Pro Desktop (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Visual Studio Build Tools (C++ workload)
        run: choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --quiet --wait --norestart" -y
        shell: pwsh

      - name: Build desktop installer
        run: npm run electron:build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          INTERNAL_API_SHARED_SECRET: ${{ secrets.INTERNAL_API_SHARED_SECRET }}
          RENOVO_PORTAL_BASE_URL: ${{ secrets.RENOVO_PORTAL_BASE_URL }}
          TENANT_BASE_DOMAIN: ${{ secrets.TENANT_BASE_DOMAIN }}
          # electron-builder signs automatically once these are present —
          # see electron/README.md's "Code signing" section. Unset repo
          # secrets resolve to empty strings, so this is a no-op (installer
          # stays unsigned) until a real certificate is purchased and these
          # two secrets are added — no further workflow changes needed then.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Baked into resources/app-update.yml so the installed app knows
          # where to check for updates (package.json's build.publish) — see
          # electron/README.md's "Auto-updates" section. Empty until this
          # secret is added, same no-op-until-configured pattern as signing.
          DESKTOP_UPDATE_FEED_BASE_URL: ${{ secrets.DESKTOP_UPDATE_FEED_BASE_URL }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenovoPro-Desktop-Setup-${{ github.sha }}
          path: dist/*.exe
          retention-days: 14
          if-no-files-found: error

      - name: Publish release files to the update feed
        # No-op until DESKTOP_UPDATE_FEED_BASE_URL is added as a repo secret
        # — see electron/README.md's "Auto-updates" section for what it
        # needs to point at and why.
        if: ${{ secrets.DESKTOP_UPDATE_FEED_BASE_URL != '' }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/latest.yml dist/*.blockmap)
          for f in "${files[@]}"; do
            echo "Uploading $f"
            curl -sf -X POST "${{ secrets.DESKTOP_UPDATE_FEED_BASE_URL }}/api/internal/desktop-release" \
              -H "x-internal-secret: ${{ secrets.INTERNAL_API_SHARED_SECRET }}" \
              -F "file=@$f"
          done
